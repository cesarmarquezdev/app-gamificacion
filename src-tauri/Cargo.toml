[package]
name = "nivel"
version = "0.1.0"
description = "App de hábitos gamificada: misiones, rituales y flow"
authors = []
edition = "2024"

[lib]
# El sufijo _lib evita un choque de nombres con el binario en Windows.
name = "nivel_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde_json = "1"

[profile.release]
codegen-units = 1
lto = true
opt-level = 3
panic = "abort"
strip = true
